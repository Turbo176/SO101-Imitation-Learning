name: SO-101 source and results
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation-and-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy
      - run: python scripts/so101/check_release.py
      - run: python scripts/so101/verify_results.py
      - run: python -m compileall -q scripts/so101
