name: Bug report
description: Report a problem with this SO-101 experiment or its scripts.
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/PyTorch versions, robot and cameras. Include the checkpoint if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Command and error
      description: Include the command, expected behavior and full traceback. Remove private connection details.
      render: text
    validations:
      required: true
